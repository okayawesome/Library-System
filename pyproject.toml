[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "library-system"
version = "0.1.0"
description = "A command-line library system for borrowing and returning books."
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
library-system = "library_system.cli:main"
